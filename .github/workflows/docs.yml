name: Docs

# Build the MkDocs (Material + static-i18n) site and publish it to
# GitHub Pages. After the first successful run, enable Pages in the repo:
#   Settings → Pages → Build and deployment → Source = "GitHub Actions".
# The site is then served at https://<user>.github.io/<repo>/

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: pip install mkdocs-material "mkdocs-static-i18n>=1.2.0"

      - name: Build site
        # Absolute --site-dir: mkdocs resolves a relative site-dir against
        # the config file's folder (docs/), which would NOT match the
        # upload path below. An absolute path removes that ambiguity.
        run: mkdocs build --config-file docs/mkdocs.yml --site-dir "${{ github.workspace }}/_site"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
