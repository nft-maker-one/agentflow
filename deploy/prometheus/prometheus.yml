# Prometheus scrape config for the AgentKit dev stack (Doc10 §4 / §7).

global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 10s
  external_labels:
    cluster: agentkit-dev

scrape_configs:
  # ---------- AgentKit process (running on the host machine) ----------
  # The agentkit ProbeServer binds 0.0.0.0:9100 by default. Inside
  # docker-compose we resolve the host machine via the
  # ``host.docker.internal`` gateway alias declared in the compose file.
  - job_name: agentkit
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          service: agentkit

  # ---------- Prometheus self-metrics ----------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---------- OTel collector self-metrics ----------
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
